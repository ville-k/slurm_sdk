name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Fast parallel jobs that gate integration tests
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --dev

      - name: Run unit tests
        run: uv run pytest --ignore=tests/integration -n auto

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: |
            coverage.xml
            coverage_html/
          retention-days: 30

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --dev

      - name: Check code formatting
        run: uv format --check

      - name: Check ruff linting
        run: uv run ruff check

      - name: Check markdown formatting
        run: |
          uv run mdformat --check \
            docs/tutorials \
            docs/how-to \
            docs/explanation \
            docs/reference \
            docs/CHANGELOG.md \
            docs/CONTRIBUTING.md \
            README.md \
            AGENTS.md

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --dev

      - name: Run Bandit security scan
        run: uv run bandit -r src/ -ll -f txt

  docs:
    name: Documentation Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --dev

      - name: Build documentation
        run: uv run mkdocs build --strict

  # Integration tests run only after all fast checks pass
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [unit-tests, lint, security]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create Docker network
        run: docker network create slurm-dev-network

      - name: Start container registry
        run: |
          docker run -d \
            --name slurm-test-registry \
            --network slurm-dev-network \
            -p 20002:20002 \
            -e REGISTRY_STORAGE_DELETE_ENABLED=true \
            -e REGISTRY_HTTP_ADDR=:20002 \
            registry:2

      - name: Build Slurm container
        run: |
          docker build \
            -t slurm-integration:latest \
            -f containers/slurm-pyxis-integration/Containerfile \
            containers/slurm-pyxis-integration/

      - name: Start Slurm container
        run: |
          docker run -d \
            --name slurm-test \
            --hostname slurm-control \
            --privileged \
            --cgroupns=host \
            --network slurm-dev-network \
            --network-alias slurm \
            -p 2222:22 \
            -v /sys/fs/cgroup:/sys/fs/cgroup:rw \
            slurm-integration:latest \
            /sbin/init

      - name: Wait for Slurm services
        run: |
          echo "Waiting for containers to initialize..."
          sleep 10

          echo "=== Checking systemd services ==="
          for service in munge sshd slurmctld slurmd; do
            echo -n "Waiting for $service..."
            for i in $(seq 1 120); do
              if docker exec slurm-test systemctl is-active $service >/dev/null 2>&1; then
                echo " ready"
                break
              fi
              if [ $i -eq 120 ]; then
                echo " TIMEOUT"
                echo "=== $service status ==="
                docker exec slurm-test systemctl status $service || true
                echo "=== $service journal ==="
                docker exec slurm-test journalctl -u $service --no-pager -n 50 || true
              fi
              echo -n "."
              sleep 1
            done
          done

          echo ""
          echo "=== Container status ==="
          docker ps -a

          echo ""
          echo "=== Slurm node state ==="
          # Wait for node to be in IDLE state
          echo -n "Waiting for node to be IDLE..."
          for i in $(seq 1 60); do
            state=$(docker exec slurm-test sinfo -h -o "%T" 2>/dev/null || echo "unknown")
            if [ "$state" = "idle" ]; then
              echo " ready (state: $state)"
              break
            fi
            if [ $i -eq 60 ]; then
              echo " TIMEOUT (state: $state)"
              echo "=== sinfo output ==="
              docker exec slurm-test sinfo || true
              echo "=== scontrol show node ==="
              docker exec slurm-test scontrol show node || true
            fi
            echo -n "."
            sleep 2
          done

          echo ""
          echo "=== Verifying cluster with test job ==="
          docker exec slurm-test su - slurm -c "sbatch --wrap='echo hello' --wait" || {
            echo "Test job failed!"
            echo "=== slurmd journal ==="
            docker exec slurm-test journalctl -u slurmd --no-pager -n 100 || true
            echo "=== slurmctld journal ==="
            docker exec slurm-test journalctl -u slurmctld --no-pager -n 100 || true
            exit 1
          }
          echo "Test job succeeded!"

          # Enable oversubscription for workflow tests
          docker exec slurm-test scontrol update PartitionName=debug OverSubscribe=YES || true

      - name: Build dev container
        run: |
          docker build \
            -t slurm-sdk-dev:latest \
            -f containers/dev/Containerfile \
            containers/dev/

      - name: Run integration tests
        run: |
          docker run --rm \
            --network slurm-dev-network \
            -e SLURM_SDK_DEV_MODE=ci \
            -e SLURM_HOST=slurm \
            -e SLURM_PORT=22 \
            -e REGISTRY_URL=registry:20002 \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            slurm-sdk-dev:latest \
            bash -c "uv sync --dev --quiet && uv run pytest --run-integration tests/integration/ -v"

      - name: Show container logs on failure
        if: failure()
        run: |
          echo "=== Slurm container logs ==="
          docker logs slurm-test 2>&1 | tail -100 || true
          echo ""
          echo "=== Registry container logs ==="
          docker logs slurm-test-registry 2>&1 | tail -50 || true

      - name: Cleanup
        if: always()
        run: |
          docker stop slurm-test slurm-test-registry 2>/dev/null || true
          docker rm slurm-test slurm-test-registry 2>/dev/null || true
          docker network rm slurm-dev-network 2>/dev/null || true
